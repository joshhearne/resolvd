# Real client IP for the backend (login security blocks by IP).
#   - Cloudflare in front (Tunnel or proxied DNS): CF-Connecting-IP.
#   - Host proxy without Cloudflare (Caddy, nginx): the first address in
#     the X-Forwarded-For it sets.
#   - Neither: the connecting address.
# The stack only listens on 127.0.0.1, so these headers come from your
# host proxy or tunnel. That proxy must overwrite them rather than pass
# a client's own values through (see README → Host reverse proxy).
map $http_x_forwarded_for $forwarded_client_ip {
    ""                     $remote_addr;
    "~^\s*(?<first>[^,\s]+)" $first;
}
map $http_cf_connecting_ip $client_ip {
    ""      $forwarded_client_ip;
    default $http_cf_connecting_ip;
}

upstream backend {
    server backend:3001;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 55M;

    location ~ ^/(api|auth)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
