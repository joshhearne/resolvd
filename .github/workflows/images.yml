name: Images

# Builds the backend + frontend images that Docker installs run, and
# publishes them to GHCR. The host updater (deploy/resolvd-update.sh) pins
# each install to one of these exact tags:
#
#   push to dev       -> resolvd-<component>:dev-<sha7>  (+ floating :dev)
#   tag vX.Y.Z        -> resolvd-<component>:vX.Y.Z      (+ floating :stable)
#   tag vX.Y.Z-rc.N   -> resolvd-<component>:vX.Y.Z-rc.N (pre-release, no :stable)
#
# Each run goes through a GitHub Environment (development / production),
# so that environment's protection rules gate who can publish to it.

on:
  push:
    branches: [dev]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Work out tags
        id: meta
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/resolvd-${{ matrix.component }}"
          SHORT="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
            TAGS="$IMAGE:$VERSION"
            # Only full releases move :stable; release candidates don't.
            case "$VERSION" in *-*) ;; *) TAGS="$TAGS,$IMAGE:stable" ;; esac
          else
            VERSION="dev-$SHORT"
            TAGS="$IMAGE:$VERSION,$IMAGE:dev"
          fi
          {
            echo "version=$VERSION"
            echo "tags=$TAGS"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
