# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

  version: 2
  updates:
    - package-ecosystem: npm
      directory: /backend
      schedule:
        interval: weekly
        day: monday
      open-pull-requests-limit: 5
      groups:
        backend-minor-patch:
          update-types:
            - minor
            - patch
      ignore:
        # ESM-only from v3; the backend is CommonJS and uses Node's global fetch instead.
        - dependency-name: node-fetch
          update-types: ["version-update:semver-major"]

    - package-ecosystem: npm
      directory: /frontend
      schedule:
        interval: weekly
        day: monday
      open-pull-requests-limit: 5
      groups:
        frontend-minor-patch:
          update-types:
            - minor
            - patch
      ignore:
        # Planned migrations, done deliberately and together, not as bumps.
        - dependency-name: react
          update-types: ["version-update:semver-major"]
        - dependency-name: react-dom
          update-types: ["version-update:semver-major"]
        - dependency-name: "@types/react"
          update-types: ["version-update:semver-major"]
        - dependency-name: "@types/react-dom"
          update-types: ["version-update:semver-major"]
        - dependency-name: react-router-dom
          update-types: ["version-update:semver-major"]
        - dependency-name: vite
          update-types: ["version-update:semver-major"]
        - dependency-name: tailwindcss
          update-types: ["version-update:semver-major"]
        - dependency-name: "@azure/msal-browser"
          update-types: ["version-update:semver-major"]

    - package-ecosystem: docker
      directory: /backend
      schedule:
        interval: weekly
        day: monday
      ignore:
        # Stay on the current LTS line; a new Node major is a deliberate move.
        - dependency-name: node
          update-types: ["version-update:semver-major"]

    - package-ecosystem: docker
      directory: /frontend
      schedule:
        interval: weekly
        day: monday
      ignore:
        - dependency-name: node
          update-types: ["version-update:semver-major"]

    - package-ecosystem: docker-compose
      directory: /
      schedule:
        interval: weekly
        day: monday
      ignore:
        # A Postgres major needs pg_upgrade or dump/restore of the data volume.
        - dependency-name: postgres
          update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: /
      schedule:
        interval: weekly
        day: monday
