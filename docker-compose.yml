services:
  postgres:
    image: postgres:16-alpine
    container_name: resolvd-postgres
    restart: unless-stopped
    # Only what Postgres needs, not the whole .env: it holds the app's
    # secrets, and the host updater rewrites RESOLVD_IMAGE_TAG there on
    # every update, which would recreate this container each time.
    environment:
      - POSTGRES_DB=resolvd
      - POSTGRES_USER=resolvd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Published by .github/workflows/images.yml. RESOLVD_IMAGE_TAG (in .env)
    # picks the build: a release (v1.4.0), a dev build (dev-<sha>), or the
    # floating :stable / :dev. The host updater manages it on auto-update
    # installs. To build from source instead, add -f docker-compose.build.yml.
    image: ghcr.io/joshhearne/resolvd-backend:${RESOLVD_IMAGE_TAG:-stable}
    container_name: resolvd-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://resolvd:${POSTGRES_PASSWORD}@postgres:5432/resolvd
      - UPLOADS_DIR=/data/uploads
    volumes:
      - uploads-data:/data/uploads
    networks:
      internal:
        # nginx proxies to this alias, not the service name. Docker gives
        # every service its name as an alias on each network it joins, so
        # "backend" also resolves on the shared alert-intake network, where
        # any other Resolvd stack on this host (a dev or sandbox clone)
        # answers to it too and nginx would round-robin between backends.
        # An alias set only on internal stays unique to this stack.
        aliases:
          - resolvd-api
      # Polls Uptime Kuma's /metrics (http://uptime-kuma:3001) for live
      # monitored-item status. Postgres stays on internal only.
      alert-intake: {}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/joshhearne/resolvd-frontend:${RESOLVD_IMAGE_TAG:-stable}
    container_name: resolvd-frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: resolvd-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - alert-intake
    depends_on:
      - backend
      - frontend

volumes:
  pg-data:
  uploads-data:

networks:
  internal:
    driver: bridge
  # Shared with monitoring containers (Uptime Kuma): they POST alerts
  # to /api/webhooks/in/<token> via resolvd-nginx, and the backend polls
  # their status APIs. Postgres is not on it. Fixed name so other
  # projects can join it as an external network.
  alert-intake:
    name: resolvd-alert-intake
    driver: bridge
