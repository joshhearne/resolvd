services:
  postgres:
    image: postgres:16-alpine
    container_name: resolvd-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=resolvd
      - POSTGRES_USER=resolvd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        BUILT_AT: ${BUILT_AT:-}
    container_name: resolvd-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://resolvd:${POSTGRES_PASSWORD}@postgres:5432/resolvd
      - UPLOADS_DIR=/data/uploads
    volumes:
      - uploads-data:/data/uploads
    networks:
      - internal
      # Polls Uptime Kuma's /metrics (http://uptime-kuma:3001) for live
      # monitored-item status. Postgres stays on internal only.
      - alert-intake
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: resolvd-frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: resolvd-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - alert-intake
    depends_on:
      - backend
      - frontend

volumes:
  pg-data:
  uploads-data:

networks:
  internal:
    driver: bridge
  # Shared with monitoring containers (Uptime Kuma): they POST alerts
  # to /api/webhooks/in/<token> via resolvd-nginx, and the backend polls
  # their status APIs. Postgres is not on it. Fixed name so other
  # projects can join it as an external network.
  alert-intake:
    name: resolvd-alert-intake
    driver: bridge
